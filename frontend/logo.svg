<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="UltraMantenimiento">
  <!-- omega invertida (℧) blanca, fondo transparente: va sobre la barra azul. Misma geometría que herramientas/icono.py:
       anillo de centro (32,34) y radios 10 a 22, cortado arriba en y=16 con una abertura de x=27 a 37, y dos remates
       horizontales hacia afuera (y de 9 a 16) -->
  <defs>
    <clipPath id="abierto"><path clip-rule="evenodd" d="M0 16 H64 V64 H0 Z M27 16 H37 V34 H27 Z"/></clipPath>
  </defs>
  <circle cx="32" cy="34" r="16" fill="none" stroke="#fff" stroke-width="12" clip-path="url(#abierto)"/>
  <rect x="7" y="9" width="20" height="7" rx="1" fill="#fff"/>
  <rect x="37" y="9" width="20" height="7" rx="1" fill="#fff"/>
</svg>
